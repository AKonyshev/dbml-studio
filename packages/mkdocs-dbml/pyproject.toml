[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-dbml"
version = "0.1.0"
description = "Interactive DBML entity-relationship diagrams in MkDocs pages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mkdocs>=1.6", "PyYAML>=6"]
classifiers = [
  "Framework :: MkDocs",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2", "twine>=5", "pymdown-extensions>=10"]

[project.urls]
Source = "https://github.com/AKonyshev/dbml-studio"

[project.entry-points."mkdocs.plugins"]
dbml = "mkdocs_dbml.plugin:DbmlPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_dbml"]
# `_vendor/` is git-ignored — it is built, not written — and hatchling leaves
# ignored files out unless told otherwise. It is the whole point of the wheel.
artifacts = ["src/mkdocs_dbml/_vendor/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
